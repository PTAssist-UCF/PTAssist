name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-lint:
    name: API lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Throwaway test database. Same port and credentials as the local setup in backend/README.md.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ptassist
          POSTGRES_PASSWORD: ptassist
          POSTGRES_DB: ptassist_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ptassist -d ptassist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Throwaway blob storage (Azurite, the Azure Storage emulator). Same port as the local
      # setup in backend/README.md. The image's default command listens on 0.0.0.0.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        ports:
          - 10000:10000
    env:
      # tests/conftest.py points the app at this database and this storage.
      TEST_DATABASE_URL: postgresql+psycopg://ptassist:ptassist@localhost:5433/ptassist_test
      # Azurite on 127.0.0.1:10000, with the SDK's built-in development account.
      TEST_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      # The Azurite image has no health check, so wait until it answers HTTP (any status).
      - name: Wait for Azurite
        run: timeout 60 bash -c 'until curl -s -o /dev/null http://127.0.0.1:10000/; do sleep 1; done'
      - run: python -m pytest

  api-image:
    name: API image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build API image (no push)
        run: docker build --tag ptassist-api:ci ./backend

  # The AI service's checks (ai/README.md, Pull request CI).
  ai-lint:
    name: AI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  ai-tests:
    name: AI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  ai-image:
    name: AI image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build AI image (no push)
        run: docker build --tag ptassist-ai:ci ./ai
      # A missing system library only shows up inside the image, so load the video
      # libraries there and run ffmpeg once. Importing MediaPipe does not load its
      # native code; making an image does.
      - name: Check OpenCV, MediaPipe, and ffmpeg in the image
        run: |
          docker run --rm ptassist-ai:ci python -c "
          import cv2, mediapipe, numpy
          mediapipe.Image(image_format=mediapipe.ImageFormat.SRGB, data=numpy.zeros((8, 8, 3), numpy.uint8))
          print('OpenCV', cv2.__version__, 'MediaPipe', mediapipe.__version__)
          "
          docker run --rm ptassist-ai:ci ffmpeg -hide_banner -version
      # Start the image the way Compose and Azure will, and wait until /health answers.
      - name: Start the image and call /health
        run: |
          docker run --detach --name ai --publish 8001:8001 ptassist-ai:ci
          if ! timeout 60 bash -c 'until curl -sf http://127.0.0.1:8001/health; do sleep 1; done'; then
            docker logs ai
            exit 1
          fi
